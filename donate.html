<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - Safe Haven for Healing and Hope Foundation</title>

    <link rel="stylesheet" href="style.css">
    <script src="shf.js"></script>

</head>

<body>

    <header>
        <h1>Safe Haven for Healing and Hope Foundation</h1>
        <p>Healing Lives • Restoring Hope • Building Futures</p>
    </header>
    <center>
        <nav class="navbar">
            <a href="home.html">Home</a>
            <a href="home.html#about">About</a>
            <a href="programs.html">Programs</a>
            <a href="apply.html">Apply</a>
            <a href="donate.html">Donate</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </center>

    <!--DONATE-->
    <div class="content">
        <div class="donate-button-container">
            <button id="donate-btn" onclick="showDonations()">Donate</button>
        </div>

        <div id="donate" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeDonations()">&times;</span>
                <h3>Make a Donation</h3>
                <p>Choose the amount you would like to donate or enter your own:</p>
                <div id="select-amounts">
                    <button class="donate-amount" id="amount1"></button>
                    <button class="donate-amount" id="amount2"></button>
                    <button class="donate-amount" id="amount3"></button>
                    <button class="donate-amount" id="amount4"></button>
                    <button class="donate-amount" id="amount5"></button>
                </div>
                <div class="custom-amount">
                    <input type="number" id="custom-amount" placeholder="Enter custom amount" min="1">
                    <button onclick="donateCustom()">Donate Custom Amount</button>
                </div>
            </div>
        </div>
    </div>

</body>
<footer>
    <center>
        <h2>COPYRIGHT2026</h2>
    </center>
</footer>

</html>
