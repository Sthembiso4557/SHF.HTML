<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply - Safe Haven for Healing and Hope Foundation</title>

    <link rel="stylesheet" href="style.css">
    <script src="shf.js" defer></script>

</head>

<body>

    <header>
        <h1>Safe Haven for Healing and Hope Foundation</h1>
        <p>Healing Lives • Restoring Hope • Building Futures</p>
    </header>
    <center>
        <nav class="navbar">
            <a href="home.html">Home</a>
            <a href="home.html#about">About</a>
            <a href="programs.html">Programs</a>
            <a href="apply.html">Apply</a>
            <a href="donate.html">Donate</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </center>

    <!--APPLY-->
    <center>
        <div class="wrapper">
            <form id="form" action="">
                <h1> REGISTRATION FORM </h1>
                <div class="input-box">
                    <label>Full Name</label>
                    <input id="full-name" type="text" placeholder="Full name" required />
                </div>
                <div class="input-box">
                    <label>Email</label>
                    <input id="email" type="email" placeholder="Email" required />
                </div>
                <div class="input-box">
                    <label>Phone Number</label>
                    <input id="phone-number" type="tel" placeholder="Phone number" required />
                </div>
                <div class="input-box">
                    <label>Age</label>
                    <input id="age" type="number" placeholder="Age" required />
                </div>
                <div class="input-box">
                    <label>Why do you want to applying?</label>
                    <input id="reason" type="text" placeholder="Reason for applying" required />
                </div>
                <label>Area of Interest</label>
                <select id="interest" required>
                    <option value="" disabled selected>Select an area of interest</option>
                    <option value="education">Education</option>
                    <option value="healthcare">Psychological Support</option>
                    <option value="environment">Drug Recovery</option>
                    <option value="community">Youth And Community Development</option>
                    <option value="environment">Support for Street Children</option>

                </select>

                <button type="submit">Submit Application</button>
                <div id="success-message"
                    style="display:none; color:#ffffff; margin-top:16px; font-size:1rem; font-weight:700;"></div>

        </div>

        </form>
        </div>
    </center>

</body>
